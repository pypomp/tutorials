[project]
name = "pypomp-tutorials"
version = "0.1.0"
description = "Tutorials, courses, and manuscripts for pypomp"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cartopy>=0.24.0",
    "geopandas>=1.0.0",
    "ipykernel>=6.29.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "jupyter>=1.1.0",
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotnine>=0.14.0",
    "pypomp>=1.0.2",
    "scipy>=1.14.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
    "xarray>=2024.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.uv]
package = false
